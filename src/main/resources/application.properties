spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/repolens
spring.datasource.username=postgres
spring.datasource.password=sid@123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

jwt.secret=${JWT_SECRET:dev-only-repo-lens-secret-key-change-this-in-production-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

github.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.api-version=${GITHUB_API_VERSION:2022-11-28}
github.token=${GITHUB_TOKEN:}
github.analysis.max-commits=${GITHUB_MAX_COMMITS:500}
github.analysis.max-detail-commits=${GITHUB_MAX_DETAIL_COMMITS:30}
github.analysis.max-files=${GITHUB_MAX_FILES:5000}
github.analysis.max-file-size=${GITHUB_MAX_FILE_SIZE:500000}